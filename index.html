        .container {

            align-items: center;

            box-shadow: 0 2px 6px rgba(0,0,0,0.1);

            margin-bottom: 1.5rem;

        }

            border-radius: 12px;
            font-size: 1rem;
            outline: none;

        .surah-list {
            display: grid;

            gap: 1rem;

        .surah-card {
