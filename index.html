<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم - وِرْد</title>
    
    <!-- خطوط جوجل لربط الحروف العربية والخط القرآني -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #1b4d3e;
            --primary-light: #2b7a62;
            --accent-color: #d4af37;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #212529;
            --text-muted: #6c757d;
            --border-color: #e9ecef;
            --nav-bg: #ffffff;
        }

        [data-theme="dark"] {
            --primary-color: #121f1a;
            --primary-light: #1b4d3e;
            --accent-color: #e5c158;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f8f9fa;
            --text-muted: #adb5bd;
            --border-color: #2c2c2c;
            --nav-bg: #181818;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', system-ui, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px;
        }

        header {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            font-size: 1.3rem;
            color: var(--accent-color);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
        }

        .search-box input, .challenge-input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            margin-bottom: 12px;
        }

        .surah-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .surah-card {
            background-color: var(--card-bg);
            border-right: 5px solid var(--accent-color);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
            cursor: pointer;
        }

        .surah-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .surah-number {
            background-color: var(--primary-color);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .surah-name {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .surah-details {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .read-btn {
            background: transparent;
            border: 1px solid var(--primary-light);
            color: var(--primary-light);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--nav-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            flex: 1;
        }

        .nav-item.active {
            color: var(--accent-color);
            font-weight: bold;
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        .card-box {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .card-box h3 {
            color: var(--accent-color);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .streak-counter {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            color: var(--primary-light);
            margin: 15px 0;
        }

        .action-btn {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }

        .ayah-container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            line-height: 2.4;
            font-size: 1.6rem;
            text-align: justify;
            border: 1px solid var(--border-color);
            font-family: 'Amiri', serif;
            direction: rtl;
        }

        .ayah-badge {
            color: var(--accent-color);
            font-size: 1.1rem;
            margin: 0 6px;
            font-weight: bold;
            font-family: 'Cairo', sans-serif;
        }

        .friend-box {
            background: rgba(212, 175, 55, 0.1);
            border: 1px dashed var(--accent-color);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="header-title">وِرْد - القرآن الكريم</h1>
        <div class="header-actions">
            <button class="btn-icon" onclick="shareApp()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
                مشاركة
            </button>
            <button class="btn-icon" id="theme-toggle" onclick="toggleTheme()">🌙 الوضع</button>
        </div>
    </header>

    <div class="container">

        <!-- 1. المصحف -->
        <div id="mushaf-section" class="view-section active">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="ابحث عن اسم السورة..." oninput="filterSurahs()">
            </div>
            <div id="surah-list" class="surah-list">
                <div style="text-align:center; padding:30px; color:var(--text-muted);">جاري تحميل السور...</div>
            </div>
        </div>

        <!-- 2. سلسلة الأجر والتحدي المباشر -->
        <div id="wird-section" class="view-section">
            <div class="card-box">
                <h3>🔥 سلسلتك اليومية (Streak)</h3>
                <div class="streak-counter" id="streak-count">0 أيام</div>
                <button class="action-btn" onclick="incrementStreak()">✓ سجل ورد اليوم وتمت القراءة</button>
            </div>

            <!-- بطاقة التحدي اللحظي مع الصديق -->
            <div class="card-box">
                <h3>⚔️ تحدي الورد اللحظي مع صديقك</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;">أدخل رمز غرفة مشترك بينك وبين صديقك (مثال: 777):</p>
                
                <input type="text" id="room-id-input" class="challenge-input" placeholder="أدخل رمز التحدي المشترك...">
                <button class="action-btn" style="background-color: var(--primary-light); margin-bottom:10px;" onclick="connectToRoom()">ربط الغرفة وبدء التحدي</button>
                
                <!-- زر دعوة صديق عبر الرابط المباشر -->
                <button class="action-btn" style="background-color: var(--accent-color); color:#121212; margin-bottom:12px;" onclick="shareChallenge()">🔗 إرسال دعوة تحدي لصديق</button>

                <div class="friend-box">
                    <div style="font-size:0.9rem; color:var(--text-muted);">حالة صديقك الآن:</div>
                    <div id="friend-streak-display" style="font-size:1.2rem; font-weight:bold; color:var(--accent-color); margin-top:5px;">غير متصل بغرفة</div>
                </div>
            </div>
        </div>

        <!-- 3. الإعدادات -->
        <div id="settings-section" class="view-section">
            <div class="card-box">
                <h3>⚙️ الإعدادات</h3>
                <p style="font-size: 0.9rem; margin-top:5px;">تطبيق وِرْد خفيف ويدعم التحدي اللحظي.</p>
                <button class="action-btn" style="margin-top: 15px; background-color: #d9534f;" onclick="resetData()">إعادة ضبط السلسلة</button>
            </div>
        </div>

        <!-- القارئ -->
        <div id="reader-view" class="view-section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <button class="btn-icon" style="background:var(--primary-color)" onclick="backToSurahs()">← العودة</button>
                <h2 id="reader-surah-title" style="color: var(--accent-color);"></h2>
            </div>
            <div id="ayahs-container" class="ayah-container">
                <div style="text-align:center;">جاري جلب الآيات...</div>
            </div>
        </div>

    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('mushaf', this)">
            <svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
            المصحف
        </button>
        <button class="nav-item" onclick="switchTab('wird', this)">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            سلسلة الأجر
        </button>
        <button class="nav-item" onclick="switchTab('settings', this)">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c-.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/></svg>
            الإعدادات
        </button>
    </nav>

    <!-- سكريبت التطبيق الشامل -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAPY5ZiXdmj8EL1aGMASsjJ2EjI29OAWEM",
          authDomain: "wirdapp-e967c.firebaseapp.com",
          databaseURL: "https://wirdapp-e967c-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "wirdapp-e967c",
          storageBucket: "wirdapp-e967c.firebasestorage.app",
          messagingSenderId: "175270322361",
          appId: "1:175270322361:web:a9e33bf46d080a5733bb68"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myUserId = localStorage.getItem('wird_user_id') || 'user_' + Math.floor(Math.random() * 100000);
        localStorage.setItem('wird_user_id', myUserId);

        window.connectToRoom = function() {
            const roomId = document.getElementById('room-id-input').value.trim();
            if(!roomId) return alert('الرجاء كتابة رمز الغرفة أولاً');

            localStorage.setItem('wird_room_id', roomId);
            window.syncData();

            const roomRef = ref(db, 'rooms/' + roomId);
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    let friendFound = false;
                    Object.keys(data).forEach(uid => {
                        if(uid !== myUserId) {
                            friendFound = true;
                            const friend = data[uid];
                            document.getElementById('friend-streak-display').innerText = `أنجز ${friend.streak} أيام 🔥 (آخر قراءة: ${friend.lastRead})`;
                        }
                    });
                    if(!friendFound) {
                        document.getElementById('friend-streak-display').innerText = 'في إنتظار دخول صديقك لنفس الغرفة...';
                    }
                }
            });
            alert('تم الربط والغرفة جاهزة للتحدي!');
        };

        window.syncData = function() {
            const roomId = localStorage.getItem('wird_room_id');
            const streak = parseInt(localStorage.getItem('wird_streak') || '0');
            if(roomId) {
                set(ref(db, 'rooms/' + roomId + '/' + myUserId), {
                    streak: streak,
                    lastRead: new Date().toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'})
                });
            }
        };

        window.shareChallenge = function() {
            const roomId = localStorage.getItem('wird_room_id');
            if(!roomId) {
                alert('الرجاء ربط أو إنشاء غرفة تحدي أولاً من قسم سلسلة الأجر!');
                return;
            }
            
            const inviteUrl = window.location.href.split('?')[0] + '?room=' + roomId;
            const shareText = `تعال نتحدى بعض في ختم القرآن ومتابعة الورد اليومي عبر تطبيق وِرْد! اضغط على الرابط للانضمام لغرفة التحدي مباشرة: ${inviteUrl}`;

            if (navigator.share) {
                navigator.share({
                    title: 'تحدي تطبيق وِرْد',
                    text: shareText,
                    url: inviteUrl
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareText);
                alert('تم نسخ رابط دعوة التحدي! أرسله لصديقك.');
            }
        };

        // وظائف المصحف والتطبيق
        let allSurahs = [];

        window.fetchSurahs = async function() {
            try {
                const response = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await response.json();
                if (data.code === 200) {
                    allSurahs = data.data;
                    window.displaySurahs(allSurahs);
                }
            } catch (error) {
                document.getElementById('surah-list').innerHTML = '<div style="text-align:center; padding:20px;">تعذر الاتصال بالشبكة.</div>';
            }
        };

        window.displaySurahs = function(surahs) {
            const listContainer = document.getElementById('surah-list');
            if (surahs.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; padding:20px;">لا توجد نتائج</div>';
                return;
            }

            listContainer.innerHTML = surahs.map(surah => {
                let cleanName = surah.name.replace(/[\u064B-\u0652\u0670\u06D6-\u06ED]/g, "");
                cleanName = cleanName.replace('سُورَةُ ', '').replace('سورة ', '');

                return `
                <div class="surah-card" onclick="openSurah(${surah.number}, 'سورة ${cleanName}')">
                    <div class="surah-info">
                        <div class="surah-number">${surah.number}</div>
                        <div>
                            <div class="surah-name">سورة ${cleanName}</div>
                            <div class="surah-details">${surah.numberOfAyahs} آيات • ${surah.revelationType === 'Meccan' ? 'مكية' : 'مدنية'}</div>
                        </div>
                    </div>
                    <button class="read-btn">قراءة ←</button>
                </div>
                `;
            }).join('');
        };

        window.filterSurahs = function() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const filtered = allSurahs.filter(surah => {
                const cleanName = surah.name.replace(/[\u064B-\u0652\u0670\u06D6-\u06ED]/g, "");
                return cleanName.toLowerCase().includes(query) || 
                       surah.englishName.toLowerCase().includes(query) ||
                       surah.number.toString() === query;
            });
            window.displaySurahs(filtered);
        };

        window.openSurah = async function(number, name) {
            document.getElementById('mushaf-section').classList.remove('active');
            document.getElementById('reader-view').classList.add('active');
            document.getElementById('reader-surah-title').innerText = name;
            document.getElementById('ayahs-container').innerHTML = '<div style="text-align:center;">جاري جلب الآيات...</div>';

            try {
                const response = await fetch(`https://api.alquran.cloud/v1/surah/${number}/quran-simple`);
                const data = await response.json();
                if (data.code === 200) {
                    const ayahs = data.data.ayahs;
                    document.getElementById('ayahs-container').innerHTML = ayahs.map(a => 
                        `${a.text} <span class="ayah-badge">﴿${a.numberInSurah}﴾</span>`
                    ).join(' ');
                }
            } catch (error) {
                document.getElementById('ayahs-container').innerHTML = '<div style="text-align:center;">حدث خطأ في تحميل الآيات.</div>';
            }
        };

        window.backToSurahs = function() {
            document.getElementById('reader-view').classList.remove('active');
            document.getElementById('mushaf-section').classList.add('active');
        };

        window.switchTab = function(tabName, element) {
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

            element.classList.add('active');
            if (tabName === 'mushaf') {
                document.getElementById('mushaf-section').classList.add('active');
                document.getElementById('header-title').innerText = 'وِرْد - القرآن الكريم';
            } else if (tabName === 'wird') {
                document.getElementById('wird-section').classList.add('active');
                document.getElementById('header-title').innerText = 'سلسلة الأجر والتحدي';
                window.updateStreakUI();
            } else if (tabName === 'settings') {
                document.getElementById('settings-section').classList.add('active');
                document.getElementById('header-title').innerText = 'الإعدادات';
            }
        };

        let streak = parseInt(localStorage.getItem('wird_streak') || '0');
        window.updateStreakUI = function() {
            document.getElementById('streak-count').innerText = streak + ' أيام';
        };

        window.incrementStreak = function() {
            streak++;
            localStorage.setItem('wird_streak', streak);
            window.updateStreakUI();
            if(window.syncData) window.syncData();
            alert('تم تسجيل ورد اليوم بنجاح!');
        };

        window.resetData = function() {
            if(confirm('هل أنت متأكد من إعادة الضبط؟')) {
                localStorage.removeItem('wird_streak');
                streak = 0;
                window.updateStreakUI();
                if(window.syncData) window.syncData();
            }
        };

        window.shareApp = function() {
            if (navigator.share) {
                navigator.share({
                    title: 'تطبيق وِرْد',
                    text: 'تطبيق القرآن الكريم ومتابعة الورد اليومي.',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('تم نسخ رابط التطبيق!');
            }
        };

        window.toggleTheme = function() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                localStorage.setItem('wird_theme', 'light');
                document.getElementById('theme-toggle').innerText = '🌙 الوضع';
            } else {
                body.setAttribute('data-theme', 'dark');
                localStorage.setItem('wird_theme', 'dark');
                document.getElementById('theme-toggle').innerText = '☀️ النهاري';
            }
        };

        // التشغيل المباشر والتقاط الرابط عند فتح الدعوة
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('wird_theme') === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
                document.getElementById('theme-toggle').innerText = '☀️ النهاري';
            }
            window.fetchSurahs();
            window.updateStreakUI();

            // فحص إذا تم فتح التطبيق عبر رابط دعوة صديق
            const urlParams = new URLSearchParams(window.location.search);
            const roomFromUrl = urlParams.get('room');
            if(roomFromUrl) {
                localStorage.setItem('wird_room_id', roomFromUrl);
                document.getElementById('room-id-input').value = roomFromUrl;
                window.connectToRoom();
            } else {
                const savedRoom = localStorage.getItem('wird_room_id');
                if(savedRoom) {
                    document.getElementById('room-id-input').value = savedRoom;
                    window.connectToRoom();
                }
            }
        });
    </script>
</body>
</html>
