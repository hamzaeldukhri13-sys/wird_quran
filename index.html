<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2C3E2E">
    <title>وِرْد | Wird</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        .font-quran { font-family: 'Amiri', serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 10px; }
        .tab-content { display: none; animation: fadeIn 0.3s ease-in-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse-lock { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }
        .lock-icon { animation: pulse-lock 2s infinite ease-in-out; }
        .progress-bar { transition: width 0.1s linear; }
        .bracket-match { background: white; border: 1px solid #e5e7eb; border-radius: 0.75rem; padding: 0.75rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem; margin-bottom: 0.5rem; }
        .dark .bracket-match { background: #2C3E2E; border-color: #3f4a3f; }
        #toast { transition: opacity 0.3s, transform 0.3s; }
        .modal-backdrop { background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); }
    </style>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: {
                olive: { DEFAULT: '#2C3E2E', light: '#3D5340', dark: '#1E2B20' },
                gold: { DEFAULT: '#C5A059', light: '#D4B87A', dark: '#A8883F' },
                cream: '#F8F7F2',
            }}}
        }
    </script>
</head>
<body class="bg-cream text-gray-800 antialiased pb-20">

    <div id="app" class="max-w-md mx-auto min-h-screen relative bg-[#F8F7F2] dark:bg-[#1a1e1a] transition-colors duration-300">

        <!-- ========== TAB 1: QURAN ========== -->
        <div id="tab-quran" class="tab-content active px-4 pt-6">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-olive dark:text-gold">القرآن الكريم</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">وِرْدك اليومي من كتاب الله</p>
                </div>
                <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-full bg-white dark:bg-olive-light shadow-sm flex items-center justify-center text-olive dark:text-gold border border-gray-200 dark:border-gray-700">
                    <i id="dark-icon" class="fas fa-moon"></i>
                </button>
            </div>

            <div class="relative mb-6">
                <i class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="search-surah" placeholder="ابحث عن اسم السورة..." oninput="filterSurahs()" class="w-full bg-white dark:bg-olive-light border border-gray-200 dark:border-gray-700 rounded-xl py-3 pr-11 pl-4 text-sm focus:outline-none focus:ring-2 focus:ring-gold/50 transition text-gray-800 dark:text-white placeholder-gray-400">
            </div>

            <div id="wird-status" class="bg-white dark:bg-olive-light rounded-xl p-4 mb-6 border border-gray-200 dark:border-gray-700 shadow-sm flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gold/10 flex items-center justify-center text-gold">
                        <i class="fas fa-book-open"></i>
                    </div>
                    <div>
                        <p class="text-sm font-bold text-olive dark:text-gold">وِرْد اليوم</p>
                        <p id="wird-text" class="text-xs text-gray-500 dark:text-gray-400">صفحة 1 من المصحف</p>
                    </div>
                </div>
                <button onclick="completeWird()" id="btn-complete-wird" class="bg-gold text-white text-xs font-bold px-4 py-2 rounded-lg shadow-sm hover:bg-gold-dark transition">إتمام</button>
            </div>

            <!-- شاشة تحميل الفهرس -->
            <div id="quran-loading" class="text-center py-8">
                <i class="fas fa-spinner fa-spin text-2xl text-gold mb-3"></i>
                <p class="text-sm text-gray-500">جاري جلب فهرس السور الكامل (114 سورة)...</p>
            </div>

            <!-- فهرس السور -->
            <div id="surah-list" class="space-y-2 pb-4"></div>
        </div>

        <!-- ========== TAB 2: COMPETITIONS (مختصر للتركيز على طلبك) ========== -->
        <div id="tab-competitions" class="tab-content px-4 pt-6">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-olive dark:text-gold">المسابقات</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">تحديات حفظ وتلاوة</p>
                </div>
                <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-full bg-white dark:bg-olive-light shadow-sm flex items-center justify-center text-olive dark:text-gold border border-gray-200 dark:border-gray-700">
                    <i id="dark-icon-2" class="fas fa-moon"></i>
                </button>
            </div>
            <div class="bg-white dark:bg-olive-light rounded-2xl p-8 border border-gray-200 dark:border-gray-700 shadow-sm text-center">
                <p class="text-sm text-gray-500">قسم المسابقات (يُفتح بعد أذان العشاء)</p>
            </div>
        </div>

        <!-- ========== TAB 3: SETTINGS (مختصر) ========== -->
        <div id="tab-settings" class="tab-content px-4 pt-6">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-olive dark:text-gold">الإعدادات</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">الملف الشخصي والإدارة</p>
                </div>
                <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-full bg-white dark:bg-olive-light shadow-sm flex items-center justify-center text-olive dark:text-gold border border-gray-200 dark:border-gray-700">
                    <i id="dark-icon-3" class="fas fa-moon"></i>
                </button>
            </div>
            <div class="bg-white dark:bg-olive-light rounded-2xl p-5 border border-gray-200 dark:border-gray-700 shadow-sm">
                <p class="text-sm text-gray-500">إعدادات التطبيق</p>
            </div>
        </div>

        <!-- ========== BOTTOM NAV ========== -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white dark:bg-olive-light border-t border-gray-200 dark:border-gray-700 z-50">
            <div class="flex justify-around items-center h-16">
                <button onclick="switchTab('settings')" class="nav-btn flex flex-col items-center w-full h-full text-gray-400 dark:text-gray-500" id="nav-settings">
                    <i class="fas fa-cog text-lg mb-1"></i><span class="text-[10px] font-medium">الإعدادات</span>
                </button>
                <button onclick="switchTab('competitions')" class="nav-btn flex flex-col items-center w-full h-full text-gray-400 dark:text-gray-500 relative" id="nav-competitions">
                    <i class="fas fa-trophy text-lg mb-1"></i><span class="text-[10px] font-medium">المسابقات</span>
                </button>
                <button onclick="switchTab('quran')" class="nav-btn flex flex-col items-center w-full h-full text-gold" id="nav-quran">
                    <i class="fas fa-book-quran text-lg mb-1"></i><span class="text-[10px] font-bold">المصحف</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-olive text-white text-xs px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none z-[100] transition-opacity duration-300"></div>

    <!-- مشغل الصوت العائم -->
    <div id="audio-player" class="hidden fixed bottom-20 left-4 right-4 max-w-md mx-auto bg-olive text-white rounded-xl p-3 shadow-xl z-40 flex items-center gap-3">
        <button onclick="togglePlay()" id="play-pause-btn" class="w-10 h-10 rounded-full bg-gold flex items-center justify-center text-olive shrink-0"><i class="fas fa-pause"></i></button>
        <div class="flex-1 min-w-0">
            <p id="player-title" class="text-xs font-bold truncate">-</p>
            <div class="w-full bg-white/20 h-1.5 rounded-full mt-1 overflow-hidden">
                <div id="player-progress" class="progress-bar bg-gold h-full w-0"></div>
            </div>
        </div>
        <button onclick="closePlayer()" class="text-white/60"><i class="fas fa-times"></i></button>
    </div>

    <script>
        // ==========================================
        // 1. جلب فهرس السور الـ 114 كاملاً من API رسمي
        // ==========================================
        let allSurahs = []; // سنخزن هنا السور بعد جلبها
        let currentAudio = null;
        let state = { darkMode: false };

        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            fetchSurahIndex(); // جلب الفهرس
        });

        async function fetchSurahIndex() {
            try {
                // استخدام Al Quran Cloud API الرسمي لجلب قائمة السور
                const response = await fetch('https://api.alquran.cloud/v1/surah');
                const json = await response.json();
                
                if (json.code === 200 && json.data) {
                    allSurahs = json.data; // تحتوي على 114 سورة بالضبط
                    document.getElementById('quran-loading').classList.add('hidden');
                    renderSurahs(); // عرض السور
                } else {
                    throw new Error('فشل في جلب البيانات');
                }
            } catch (error) {
                console.error(error);
                document.getElementById('quran-loading').innerHTML = `
                    <div class="text-red-500 text-sm">
                        <i class="fas fa-exclamation-triangle mb-2 text-xl"></i><br>
                        تعذر جلب الفهرس. تأكد من اتصالك بالإنترنت.<br>
                        <button onclick="fetchSurahIndex()" class="mt-2 bg-gold text-white px-4 py-1 rounded-lg">إعادة المحاولة</button>
                    </div>
                `;
            }
        }

        // ==========================================
        // 2. عرض السور في الشاشة الرئيسية
        // ==========================================
        function renderSurahs(filterText = '') {
            const list = document.getElementById('surah-list');
            
            // فلترة السور حسب البحث
            const filtered = allSurahs.filter(s => 
                s.name.includes(filterText) || 
                s.englishName.toLowerCase().includes(filterText.toLowerCase()) ||
                String(s.number) === filterText
            );

            if (filtered.length === 0) {
                list.innerHTML = `<p class="text-center text-sm text-gray-400 py-8">لا توجد نتائج مطابقة</p>`;
                return;
            }

            list.innerHTML = filtered.map(s => `
                <div class="bg-white dark:bg-olive-light rounded-xl p-3 border border-gray-200 dark:border-gray-700 shadow-sm flex items-center gap-3">
                    <!-- رقم السورة -->
                    <div class="w-10 h-10 rounded-lg bg-olive/5 dark:bg-gold/10 flex items-center justify-center text-olive dark:text-gold font-bold text-sm shrink-0">${s.number}</div>
                    
                    <!-- اسم السورة -->
                    <div class="flex-1 min-w-0">
                        <p class="font-bold text-olive dark:text-gold text-sm">سورة ${s.name.replace('سُورَةُ ', '')}</p>
                        <p class="text-xs text-gray-400">${s.numberOfAyahs} آية • ${s.revelationType === 'Meccan' ? 'مكية' : 'مدنية'}</p>
                    </div>
                    
                    <!-- أزرار التحكم -->
                    <div class="flex gap-1 shrink-0">
                        <!-- زر القراءة -->
                        <button onclick="readSurah(${s.number}, '${s.name}')" class="bg-gold text-white text-xs font-bold px-3 py-2 rounded-lg hover:bg-gold-dark transition">قراءة</button>
                        <!-- زر الاستماع (تلاوة) -->
                        <button onclick="playAudio(${s.number}, '${s.name}')" class="bg-olive dark:bg-gold/80 text-white text-xs px-3 py-2 rounded-lg hover:bg-olive-dark transition"><i class="fas fa-headphones"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function filterSurahs() {
            const text = document.getElementById('search-surah').value.trim();
            renderSurahs(text);
        }

        // ==========================================
        // 3. وظيفة القراءة (فتح النص الكامل للسورة)
        // ==========================================
        function readSurah(number, name) {
            // نفتح صفحة السورة على موقع موثوق (quran.com)
            window.open(`https://quran.com/${number}`, '_blank');
            showToast(`فتح سورة ${name} للقراءة`);
        }

        // ==========================================
        // 4. وظيفة الاستماع للتلاوة (صوت كامل للسورة)
        // ==========================================
        function playAudio(number, name) {
            if (currentAudio) {
                currentAudio.pause();
            }

            // رابط التلاوة الكاملة للسورة من CDN الرسمي (بصوت مشاري العفاسي)
            // الرابط: https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/{number}.mp3
            const audioUrl = `https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${number}.mp3`;
            
            currentAudio = new Audio(audioUrl);
            currentAudio.volume = 0.9;

            const player = document.getElementById('audio-player');
            const title = document.getElementById('player-title');
            const progress = document.getElementById('player-progress');
            const playBtn = document.getElementById('play-pause-btn');

            title.textContent = `سورة ${name} - مشاري العفاسي`;
            progress.style.width = '0%';
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            player.classList.remove('hidden');

            currentAudio.addEventListener('timeupdate', () => {
                if (currentAudio.duration) {
                    const pct = (currentAudio.currentTime / currentAudio.duration) * 100;
                    progress.style.width = pct + '%';
                }
            });

            currentAudio.addEventListener('ended', () => {
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                progress.style.width = '100%';
            });

            currentAudio.play().catch((e) => {
                console.error(e);
                showToast('تعذر تشغيل الصوت، قد يكون الملف غير متاح');
            });

            showToast(`جاري تشغيل تلاوة سورة ${name}`);
            
            // إتمام الورد عند الاستماع
            if (document.getElementById('btn-complete-wird').textContent !== 'مكتمل ✓') {
                completeWird();
            }
        }

        function togglePlay() {
            if (!currentAudio) return;
            const btn = document.getElementById('play-pause-btn');
            if (currentAudio.paused) {
                currentAudio.play();
                btn.innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                currentAudio.pause();
                btn.innerHTML = '<i class="fas fa-play"></i>';
            }
        }

        function closePlayer() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            document.getElementById('audio-player').classList.add('hidden');
        }

        // ==========================================
        // 5. إتمام الورد اليومي
        // ==========================================
        function completeWird() {
            const btn = document.getElementById('btn-complete-wird');
            if (btn.textContent === 'مكتمل ✓') return;

            btn.textContent = 'مكتمل ✓';
            btn.classList.replace('bg-gold', 'bg-green-600');
            btn.classList.add('cursor-not-allowed');
            document.getElementById('wird-text').textContent = 'تم إتمام وِرْد اليوم، بارك الله فيك';
            showToast('بارك الله فيك، تم إتمام الورد اليومي');
        }

        // ==========================================
        // 6. التنقل والوضع الليلي
        // ==========================================
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('text-gold');
                el.classList.add('text-gray-400', 'dark:text-gray-500');
            });
            const activeNav = document.getElementById('nav-' + tab);
            activeNav.classList.remove('text-gray-400', 'dark:text-gray-500');
            activeNav.classList.add('text-gold');
        }

        function toggleDarkMode() {
            state.darkMode = !state.darkMode;
            document.documentElement.classList.toggle('dark');
            ['dark-icon','dark-icon-2','dark-icon-3'].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.className = state.darkMode ? 'fas fa-sun' : 'fas fa-moon';
            });
            localStorage.setItem('wirdDarkMode', state.darkMode);
        }

        function loadState() {
            const saved = localStorage.getItem('wirdDarkMode');
            if (saved === 'true') {
                state.darkMode = true;
                document.documentElement.classList.add('dark');
                ['dark-icon','dark-icon-2','dark-icon-3'].forEach(id => {
                    const el = document.getElementById(id);
                    if(el) el.className = 'fas fa-sun';
                });
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.opacity = '1';
            t.style.transform = 'translateX(-50%) translateY(0)';
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.transform = 'translateX(-50%) translateY(-10px)';
            }, 2500);
        }
    </script>
</body>
    </html>
